<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline';
  img-src 'self' https: data:;
  connect-src 'self' https: http://localhost:* http://127.0.0.1:*;
">
  <title>Apps — Fox Store</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .app-card {
      position: relative;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: linear-gradient(160deg, rgba(99,102,241,0.08), var(--card) 45%);
      padding: 14px;
      transition: border-color 0.15s, transform 0.12s;
      cursor: pointer;
    }
    .app-card:hover { border-color: var(--primary); transform: translateY(-1px); }
    .app-id-chip {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 8px; padding: 4px 8px; border-radius: 8px;
      background: rgba(0,0,0,0.25); border: 1px solid var(--border);
      font-family: ui-monospace, monospace; font-size: 11px; color: #93c5fd;
      max-width: 100%; word-break: break-all;
      cursor: pointer;
    }
    .app-id-chip button {
      border: none; background: transparent; color: var(--muted);
      cursor: pointer; font-size: 12px; padding: 0 2px;
    }
    .app-card-actions { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
    .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .detail-panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
    .detail-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
    .detail-title { font-size: 18px; margin: 0; }
    .detail-sub { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
    .detail-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .detail-desc { font-size: 13px; color: var(--muted); margin: 12px 0; }
    .detail-section { font-size: 13px; font-weight: 600; margin: 16px 0 8px; }
    .price-list { display: flex; flex-direction: column; gap: 8px; }
    .price-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px; border: 1px solid var(--border); border-radius: 10px; }
    .price-info { flex: 1; }
    .price-name { font-size: 13px; font-weight: 600; }
    .price-dur { font-size: 11px; color: var(--muted); }
    .price-buy { display: flex; align-items: center; gap: 8px; }
    .price-amt { font-size: 14px; font-weight: 700; }
  </style>
</head>
<body>
  <div id="app" class="layout"></div>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    var modsCache = [];
    requireAuth();
    document.addEventListener("auth-ready", function () {
      mountShell("Apps");
      document.getElementById("page-content").innerHTML =
        '<div class="page-header" style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">' +
          '<div><h1>Apps</h1><p>Tap a card to view pricing &amp; generate keys</p></div>' +
          (isRuler()
            ? '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
                '<a class="btn" href="packages.html">Manage Pricing</a>' +
                '<button class="btn btn-primary" type="button" onclick="showCreateForm()">+ Add App</button>' +
              '</div>'
            : '') +
        '</div>' +
        '<div id="formContainer"></div>' +
        '<div id="detailPanel" hidden></div>' +
        '<div id="content" class="app-grid"><div class="empty"><span class="spinner"></span></div></div>';
      loadMods();
    });

    async function moveMod(id, dir) {
      if (!isRuler()) return;
      var list = (modsCache || []).map(function (m) { return m.id; });
      var i = list.indexOf(id);
      if (i < 0) return;
      var j = i + dir;
      if (j < 0 || j >= list.length) return;
      var tmp = list[i]; list[i] = list[j]; list[j] = tmp;
      try {
        await api("/mods/reorder", { method: "POST", body: { order: list } });
        showToast("Order saved");
        loadMods();
      } catch (e) { showToast(e.message || String(e), "error"); }
    }

    async function loadMods() {
      var box = document.getElementById("content");
      try {
        var res = await api("/mods");
        modsCache = res.data || [];
        if (!modsCache.length) {
          box.innerHTML = '<div class="empty">No apps yet.</div>';
          return;
        }
        box.className = "app-grid";
        box.innerHTML = modsCache.map(function (m) {
          var logo = m.logoUrl
            ? '<img src="' + esc(m.logoUrl) + '" alt="" style="width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--bg)">'
            : '<div style="width:44px;height:44px;border-radius:10px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:18px">' +
                esc((m.displayName || m.name || "?").charAt(0).toUpperCase()) + "</div>";

          var controls = "";
          if (isRuler()) {
            controls =
              '<div class="app-card-actions" onclick="event.stopPropagation()">' +
                '<button class="btn btn-sm" type="button" title="Move up" onclick="moveMod(\'' + esc(m.id) + '\',-1)">↑</button>' +
                '<button class="btn btn-sm" type="button" title="Move down" onclick="moveMod(\'' + esc(m.id) + '\',1)">↓</button>' +
                '<button class="btn btn-sm" type="button" onclick="editMod(\'' + esc(m.id) + '\')">Edit</button>' +
                '<button class="btn btn-sm" type="button" onclick="toggleModActive(\'' + esc(m.id) + '\',' + (m.isActive ? "false" : "true") + ')">' +
                  (m.isActive ? "⏸ Disable" : "▶ Enable") + "</button>" +
                '<button class="btn btn-sm btn-danger" type="button" onclick="deleteMod(\'' + esc(m.id) + '\',\'' + esc(m.displayName || m.name) + '\')">Delete</button>' +
              "</div>";
          }

          return (
            '<div class="app-card" onclick="openAppDetail(\'' + esc(m.id) + '\')">' +
              '<div style="display:flex;gap:12px;align-items:center">' +
                logo +
                '<div style="flex:1;min-width:0">' +
                  '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">' +
                    '<strong style="font-size:15px">' + esc(m.displayName || m.name) + '</strong>' +
                    '<span class="badge ' + (m.isActive ? "badge-active" : "badge-deleted") + '">' + (m.isActive ? "active" : "off") + '</span>' +
                  '</div>' +
                  '<div style="font-size:12px;color:var(--muted);margin-top:4px">' +
                    '<span class="mono">' + esc(m.name) + '</span> · v' + esc(m.version || "1.0.0") +
                    ' · <span style="color:#38bdf8">' + esc(String(m.keyCount || 0)) + ' keys</span>' +
                  '</div>' +
                  (isRuler()
                    ? (function () {
                        var id = String(m.id || "");
                        var short = id.length > 12 ? id.slice(0, 6) + "…" + id.slice(-4) : id;
                        return '<div class="app-id-chip" onclick="event.stopPropagation();copyToClipboard(\'' + esc(id) + '\')" title="Click to copy full ID">' +
                          '<span style="color:var(--muted)">ID</span> <span class="mono">' + esc(short) + '</span></div>';
                      })()
                    : '') +
                '</div>' +
              '</div>' +
              controls +
            '</div>'
          );
        }).join("");
      } catch (e) {
        box.innerHTML = '<div class="empty" style="color:var(--danger)">' + esc(e.message) + '</div>';
      }
    }

    async function openAppDetail(id) {
      var panel = document.getElementById("detailPanel");
      var grid = document.getElementById("content");
      if (grid) grid.style.display = "none";
      panel.hidden = false;
      panel.innerHTML = '<div class="detail-panel"><div class="empty"><span class="spinner"></span></div></div>';
      window.scrollTo({ top: 0, behavior: "smooth" });
      try {
        var modRes = await api("/mods/" + encodeURIComponent(id));
        var m = modRes.data;
        var pkgRes = await api("/packages?modId=" + encodeURIComponent(id));
        var pkgs = pkgRes.data || [];

        var pkgHtml = !pkgs.length
          ? '<div class="empty" style="padding:16px 0">No pricing yet.' +
              (isRuler() ? ' <a href="packages.html">Add pricing →</a>' : '') +
            '</div>'
          : '<div class="price-list">' + pkgs.map(function (p) {
              return (
                '<div class="price-row">' +
                  '<div class="price-info">' +
                    '<div class="price-name">' + esc(p.name || p.duration || "Package") + '</div>' +
                    '<div class="price-dur">' + esc(p.duration || "") + '</div>' +
                  '</div>' +
                  '<div class="price-buy">' +
                    '<span class="price-amt">' + formatPriceHtml(p.price) + '</span>' +
                    '<a class="btn btn-sm btn-primary" href="new-key.html?modId=' + encodeURIComponent(id) +
                      '&packageId=' + encodeURIComponent(p.id) + '">Purchase</a>' +
                  '</div>' +
                '</div>'
              );
            }).join('') + '</div>';

        panel.innerHTML =
          '<div class="detail-panel">' +
            '<div class="detail-head">' +
              '<div>' +
                '<h2 class="detail-title">' + esc(m.displayName || m.name) + '</h2>' +
                '<p class="detail-sub">' + esc(m.name) + ' · v' + esc(m.version || "1.0.0") + '</p>' +
              '</div>' +
              '<div class="detail-actions">' +
                '<a class="btn btn-sm btn-primary" href="new-key.html?modId=' + encodeURIComponent(id) + '">+ Purchase</a>' +
                (isRuler() ? '<a class="btn btn-sm" href="packages.html?modId=' + encodeURIComponent(id) + '">Edit Pricing</a>' : '') +
                '<button class="btn btn-sm" type="button" onclick="closeAppDetail()">Close</button>' +
              '</div>' +
            '</div>' +
            (m.description ? '<p class="detail-desc">' + esc(m.description) + '</p>' : '') +
            '<h3 class="detail-section">Pricing</h3>' +
            pkgHtml +
          '</div>';
      } catch (e) {
        panel.innerHTML =
          '<div class="detail-panel"><p style="color:var(--danger)">' + esc(e.message) +
          '</p><button class="btn btn-sm" type="button" onclick="closeAppDetail()">Close</button></div>';
      }
    }

    function closeAppDetail() {
      var panel = document.getElementById("detailPanel");
      var grid = document.getElementById("content");
      if (panel) { panel.innerHTML = ''; panel.hidden = true; }
      if (grid) grid.style.display = '';
    }

    function showCreateForm() {
      if (!isRuler()) return;
      document.getElementById("formContainer").innerHTML =
        '<div class="card"><div class="card-header"><h2>Add App</h2></div><div class="card-body">' +
        '<form id="modForm">' +
          '<p style="font-size:12px;color:var(--muted);margin:0 0 12px">Fill what you need — empty fields save as blank / defaults.</p>' +
          '<div class="form-row">' +
            '<div class="form-group"><label>App name *</label><input type="text" id="modDisplayName" required placeholder="Display name"></div>' +
            '<div class="form-group"><label>Slug (optional)</label><input type="text" id="modSlug" placeholder="auto from name"></div>' +
          '</div>' +
          '<div class="form-group"><label>Description</label><textarea id="modDescription" rows="2" placeholder="Optional"></textarea></div>' +
          '<div class="form-row">' +
            '<div class="form-group"><label>Version</label><input type="text" id="modVersion" placeholder="1.0.0"></div>' +
            '<div class="form-group"><label>Package name</label><input type="text" id="modPackageName" placeholder="com.example.app"></div>' +
          '</div>' +
          '<div class="form-row">' +
            '<div class="form-group"><label>Min version</label><input type="text" id="modMinVersion" placeholder="Optional"></div>' +
            '<div class="form-group"><label>Logo URL</label><input type="url" id="modLogo" placeholder="https://..."></div>' +
          '</div>' +
          '<div class="form-row">' +
            '<div class="form-group"><label><input type="checkbox" id="modForceUpdate" style="width:auto;margin-right:6px"> Force update</label></div>' +
            '<div class="form-group"><label><input type="checkbox" id="modMaintenance" style="width:auto;margin-right:6px"> Maintenance mode</label></div>' +
          '</div>' +
          '<button type="submit" class="btn btn-primary">Create</button> ' +
          '<button type="button" class="btn" onclick="document.getElementById(\'formContainer\').innerHTML=\'\'">Cancel</button>' +
        '</form></div></div>';
      document.getElementById("modForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        var displayName = document.getElementById("modDisplayName").value.trim();
        var slug = document.getElementById("modSlug").value.trim();
        var version = document.getElementById("modVersion").value.trim() || "1.0.0";
        try {
          await api("/mods", {
            method: "POST",
            body: {
              displayName: displayName,
              name: slug || displayName.toLowerCase().replace(/[^a-z0-9]+/g, "").substring(0, 24) || "app",
              description: document.getElementById("modDescription").value.trim() || "",
              version: version,
              packageName: document.getElementById("modPackageName").value.trim() || null,
              minVersion: document.getElementById("modMinVersion").value.trim() || null,
              logoUrl: document.getElementById("modLogo").value.trim() || null,
              forceUpdate: document.getElementById("modForceUpdate").checked,
              maintenanceMode: document.getElementById("modMaintenance").checked
            }
          });
          showToast("App created");
          document.getElementById("formContainer").innerHTML = "";
          loadMods();
        } catch (err) { showToast(err.message, "error"); }
      });
    }

    async function editMod(id) {
      if (!isRuler()) return;
      try {
        var res = await api("/mods/" + encodeURIComponent(id));
        var m = res.data;
        document.getElementById("formContainer").innerHTML =
          '<div class="card"><div class="card-header"><h2>Edit: ' + esc(m.displayName || m.name) + '</h2></div><div class="card-body">' +
          '<form id="editModForm">' +
            '<div class="form-group"><label>App Name</label><input type="text" id="editDisplayName" value="' + esc(m.displayName || m.name) + '"></div>' +
            '<div class="form-group"><label>Logo URL</label><input type="url" id="editLogo" value="' + esc(m.logoUrl || '') + '"></div>' +
            '<div class="form-group"><label>Version</label><input type="text" id="editVersion" value="' + esc(m.version || "1.0.0") + '"></div>' +
            '<div class="form-group"><label>Description</label><textarea id="editDescription" rows="2">' + esc(m.description || '') + '</textarea></div>' +
            '<div class="form-group"><label><input type="checkbox" id="editIsActive" style="width:auto;margin-right:6px" ' + (m.isActive ? "checked" : "") + '>Enabled</label></div>' +
            '<button type="submit" class="btn btn-primary">Save</button> ' +
            '<button type="button" class="btn" onclick="document.getElementById(\'formContainer\').innerHTML=\'\'">Cancel</button>' +
          '</form></div></div>';
        document.getElementById("editModForm").addEventListener("submit", async function (e) {
          e.preventDefault();
          try {
            await api("/mods/" + encodeURIComponent(id), {
              method: "PATCH",
              body: {
                displayName: document.getElementById("editDisplayName").value.trim(),
                logoUrl: document.getElementById("editLogo").value.trim() || null,
                version: document.getElementById("editVersion").value.trim(),
                description: document.getElementById("editDescription").value.trim() || null,
                isActive: document.getElementById("editIsActive").checked
              }
            });
            showToast("Saved");
            document.getElementById("formContainer").innerHTML = "";
            loadMods();
          } catch (err) { showToast(err.message, "error"); }
        });
        window.scrollTo({ top: 0, behavior: "smooth" });
      } catch (e) { showToast(e.message, "error"); }
    }

    async function toggleModActive(id, active) {
      if (!isRuler()) return;
      try {
        await api("/mods/" + encodeURIComponent(id), { method: "PATCH", body: { isActive: active } });
        showToast(active ? "Enabled" : "Disabled");
        loadMods();
      } catch (e) { showToast(e.message, "error"); }
    }

    async function deleteMod(id, name) {
      if (!isRuler()) return;
      if (!confirm('HARD DELETE app "' + name + '" and ALL its keys/packages permanently?')) return;
      try {
        await api("/mods/" + encodeURIComponent(id) + "?hard=1", { method: "DELETE" });
        showToast("App hard deleted");
        document.getElementById("detailPanel").innerHTML = "";
        closeAppDetail();
        loadMods();
      } catch (e) { showToast(e.message, "error"); }
    }
  </script>
</body>
</html>
