<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline';
  img-src 'self' https: data:;
  connect-src 'self' https: http://localhost:* http://127.0.0.1:*;
">
  <title>Keys — Fox Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="layout"></div>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    var state = { mod: "all", status: "all", q: "", deviceId: "", packageId: "all", sellerId: "all", keyType: "all", page: 1, keys: [], total: 0, totalPages: 1, selected: new Set(), mods: [], packages: [], sellers: [] };
    var canManage = false;
    var debounce = null;

    function deviceCount(k) {
      if (!k) return 0;
      // TrialKey list API returns numeric deviceCount from TrialDeviceBinding
      if (typeof k.deviceCount === "number" && !isNaN(k.deviceCount)) return k.deviceCount;
      if (k.deviceCount != null && String(k.deviceCount).trim() !== "") {
        var n = parseInt(k.deviceCount, 10);
        if (!isNaN(n)) return n;
      }
      var d = k.devices;
      if (!d) return 0;
      if (Array.isArray(d)) return d.length;
      if (typeof d === "string") {
        try { var p = JSON.parse(d); return Array.isArray(p) ? p.length : 0; } catch (e) { return 0; }
      }
      return 0;
    }

    /** Pretty trial duration: +3d / 30m / 12h → 3d / 30m / 12h */
    function formatTrialDuration(raw) {
      if (!raw) return "—";
      var s = String(raw).trim().replace(/^\+/, "");
      return s || "—";
    }

    function statusBadge(status) {
      var s = (status || "active").toLowerCase();
      var cls = "badge ";
      if (s === "active") cls += "badge-active";
      else if (s === "paused") cls += "badge-paused";
      else if (s === "banned" || s === "revoked") cls += "badge-banned";
      else if (s === "expired") cls += "badge-deleted";
      else cls += "badge-info";
      return '<span class="' + cls + '">' + esc(s) + "</span>";
    }

    requireAuth();
    document.addEventListener("auth-ready", function () {
      canManage = isManager();
      var jobs = [
        api("/mods").then(function (res) { state.mods = (res && res.data) || []; }).catch(function () { state.mods = []; }),
        api("/packages?all=1").then(function (res) { state.packages = (res && res.data) || []; }).catch(function () { state.packages = []; })
      ];
      if (typeof isRuler === "function" && isRuler()) {
        jobs.push(api("/resellers").then(function (res) { state.sellers = (res && res.data) || []; }).catch(function () { state.sellers = []; }));
      }
      Promise.all(jobs).finally(function () {
        render();
        loadKeys();
      });
    });

    function packageOptionsHtml() {
      var list = state.packages || [];
      if (state.mod && state.mod !== "all") {
        list = list.filter(function (p) {
          return p.modName === state.mod || p.mod === state.mod ||
            (state.mods || []).some(function (m) { return m.name === state.mod && (p.modId === m.id || p.mod_id === m.id); });
        });
      }
      return '<option value="all">All packages</option>' + list.map(function (p) {
        return '<option value="' + esc(p.id) + '"' + (state.packageId === p.id ? " selected" : "") + '>' +
          esc(p.name || p.duration || "pkg") + '</option>';
      }).join("");
    }

    function render() {
      mountShell("Keys");
      var root = document.getElementById("page-content");
      var modOpts = state.mods.map(function (m) {
        return '<option value="' + esc(m.name) + '"' + (state.mod === m.name ? " selected" : "") + ">" +
          esc(m.displayName || m.name) + "</option>";
      }).join("");

      root.innerHTML =
        '<div class="page-header">' +
          '<div><h1>Keys</h1><p id="countLabel">Loading…</p></div>' +
          '<div class="page-actions">' +
            '<button class="btn" type="button" onclick="toggleSelectAllPage()">Select all</button>' +
            '<button class="btn" type="button" onclick="exportCsv()">Export CSV</button>' +
            '<a class="btn btn-primary" href="new-key.html">+ Purchase</a>' +
          '</div>' +
        '</div>' +
        '<div class="toolbar" role="search">' +
          '<input type="text" class="toolbar-input grow" id="filterQ" placeholder="Search key…" value="' + esc(state.q) + '">' +
          '<input type="text" class="toolbar-input grow" id="filterDeviceId" placeholder="Device ID…" value="' + esc(state.deviceId) + '">' +
          '<select id="filterMod" class="toolbar-select"><option value="all">All apps</option>' + modOpts + '</select>' +
          '<select id="filterPackage" class="toolbar-select">' + packageOptionsHtml() + '</select>' +
          '<select id="filterStatus" class="toolbar-select">' +
            '<option value="all">All status</option>' +
            '<option value="active">Active</option>' +
            '<option value="paused">Paused</option>' +
            '<option value="banned">Banned</option>' +
            '<option value="expired">Expired</option>' +
            '<option value="revoked">Revoked</option>' +
          '</select>' +
          ((typeof isRuler === "function" && isRuler())
            ? ('<select id="filterKeyType" class="toolbar-select">' +
                '<option value="all">All types</option>' +
                '<option value="regular">Regular</option>' +
                '<option value="trial">Trial</option>' +
              '</select>')
            : '') +
          ((typeof isRuler === "function" && isRuler())
            ? ('<select id="filterSeller" class="toolbar-select"><option value="all">All sellers</option>' +
                state.sellers.map(function (s) {
                  return '<option value="' + esc(s.id) + '"' + (state.sellerId === s.id ? " selected" : "") + '>' +
                    esc(s.username) + '</option>';
                }).join("") + '</select>')
            : "") +
        '</div>' +
        '<div id="bulkBar" class="bulk-bar" hidden></div>' +
        '<div id="tableContent" class="key-grid"><div class="empty"><span class="spinner"></span></div></div>' +
        '<div class="pagination" id="pagination"></div>';

      document.getElementById("filterStatus").value = state.status;
      document.getElementById("filterMod").value = state.mod;
      var fkt = document.getElementById("filterKeyType"); if (fkt) fkt.value = state.keyType;
      document.getElementById("filterPackage").value = state.packageId;
      var fs = document.getElementById("filterSeller"); if (fs) fs.value = state.sellerId;

      document.getElementById("filterQ").addEventListener("input", function (e) {
        clearTimeout(debounce);
        debounce = setTimeout(function () {
          state.q = e.target.value.trim();
          state.page = 1;
          loadKeys();
        }, 320);
      });
      document.getElementById("filterDeviceId").addEventListener("input", function (e) {
        clearTimeout(debounce);
        debounce = setTimeout(function () {
          state.deviceId = e.target.value.trim();
          state.page = 1;
          loadKeys();
        }, 320);
      });
      document.getElementById("filterMod").addEventListener("change", function (e) {
        state.mod = e.target.value;
        state.packageId = "all";
        state.page = 1;
        var fp = document.getElementById("filterPackage");
        if (fp) fp.innerHTML = packageOptionsHtml();
        loadKeys();
      });
      document.getElementById("filterStatus").addEventListener("change", function (e) {
        state.status = e.target.value;
        state.page = 1;
        loadKeys();
      });
      document.getElementById("filterPackage").addEventListener("change", function (e) {
        state.packageId = e.target.value;
        state.page = 1;
        loadKeys();
      });
      var fktEl = document.getElementById("filterKeyType");
      if (fktEl) fktEl.addEventListener("change", function (e) {
        state.keyType = e.target.value;
        state.page = 1;
        loadKeys();
      });
      var fSeller = document.getElementById("filterSeller");
      if (fSeller) fSeller.addEventListener("change", function (e) {
        state.sellerId = e.target.value;
        state.page = 1;
        loadKeys();
      });
    }

    async function loadKeys() {
      var tc = document.getElementById("tableContent");
      if (tc) tc.innerHTML = '<div class="empty"><span class="spinner"></span></div>';
      try {
        var params = new URLSearchParams();
        params.set("page", String(state.page));
        params.set("pageSize", "24");
        if (state.mod !== "all") params.set("mod", state.mod);
        if (state.status !== "all") params.set("status", state.status);
        if (state.q) params.set("q", state.q);
        if (state.deviceId) params.set("deviceId", state.deviceId);
        if (state.packageId !== "all") params.set("packageId", state.packageId);
        if (typeof isRuler === "function" && isRuler()) {
          if (state.keyType !== "all") params.set("keyType", state.keyType);
        } else {
          params.set("keyType", "regular"); // sellers never see trial keys
        }
        if (state.sellerId !== "all") params.set("sellerId", state.sellerId);
        var data = await api("/keys?" + params.toString());
        state.keys = data.data || [];
        state.total = (data.pagination && data.pagination.total) || state.keys.length;
        state.totalPages = (data.pagination && data.pagination.totalPages) || 1;
        renderTable();
      } catch (err) {
        if (tc) tc.innerHTML = '<div class="empty" style="color:var(--danger)">' + esc(err.message) + "</div>";
      }
    }

    function renderTable() {
      var countLabel = document.getElementById("countLabel");
      if (countLabel) {
        countLabel.textContent =
          state.total + " key(s)" + (state.selected.size ? " · " + state.selected.size + " selected" : "");
      }

      var tc = document.getElementById("tableContent");
      var pagination = document.getElementById("pagination");
      var bulkBar = document.getElementById("bulkBar");
      if (!tc) return;

      if (!state.keys.length) {
        tc.innerHTML = '<div class="empty">No keys found.</div>';
        if (pagination) pagination.innerHTML = "";
        if (bulkBar) { bulkBar.innerHTML = ""; bulkBar.hidden = true; }
        return;
      }

      tc.className = "key-grid";
      tc.innerHTML = state.keys.map(function (k) {
        var isTrial = (k.keyType === "trial");
        var notActivated = !isTrial && !k.activatedAt && k.duration;
        var days = (isTrial || notActivated) ? null : daysUntil(k.expiresAt);
        var expired = !isTrial && !notActivated && (k.status === "expired" || days === 0);
        var validityLabel;
        if (isTrial) {
          validityLabel = "⏱ " + formatTrialDuration(k.trialDuration);
        } else if (notActivated) {
          validityLabel = "⏱ on login · " + formatTrialDuration(k.duration);
        } else if (expired) {
          validityLabel = "⏳ expired";
        } else {
          validityLabel = "⏳ " + days + "d left";
        }
        var sel = state.selected.has(k.id);
        var st = (k.status || "active").toLowerCase();
        var actions =
          '<button class="btn btn-sm" type="button" onclick="copyToClipboard(\'' + esc(k.key) + '\')" title="Copy key">Copy</button>' +
          '<a class="btn btn-sm" href="key.html?id=' + encodeURIComponent(k.id) + '" title="Details">Details</a>';
        if (true) {
          if (st === "paused" && hasPerm("key_resume")) {
            actions += '<button class="btn btn-sm" type="button" onclick="resumeKey(\'' + esc(k.id) + '\')">Resume</button>';
          } else if (st !== "banned" && hasPerm("key_pause")) {
            actions += '<button class="btn btn-sm" type="button" onclick="pauseKey(\'' + esc(k.id) + '\')">Pause</button>';
          }
          if (st === "banned" && hasPerm("key_unban")) {
            actions += '<button class="btn btn-sm" type="button" onclick="unbanKey(\'' + esc(k.id) + '\')">Unban</button>';
          } else if (st !== "banned" && hasPerm("key_ban")) {
            actions += '<button class="btn btn-sm" type="button" onclick="banKey(\'' + esc(k.id) + '\')">Ban</button>';
          }
          if ((typeof isManager === "function" && isManager()) || (typeof hasPerm === "function" && hasPerm("key_delete"))) {
            actions += '<button class="btn btn-sm btn-danger" type="button" onclick="deleteKey(\'' + esc(k.id) + '\')">Delete</button>';
          }
        }

        return (
          '<article class="key-card key-card--' + esc(st) + (sel ? " is-selected" : "") + '">' +
            '<div class="key-card-top">' +
              '<label class="key-check"><input type="checkbox" class="checkbox"' + (sel ? " checked" : "") +
                ' onchange="toggleSelect(\'' + esc(k.id) + '\', this.checked)"></label>' +
              '<a class="key-code" href="key.html?id=' + encodeURIComponent(k.id) + '">' + esc(k.key) + "</a>" +
              statusBadge(st) +
              (k.keyType === "trial" ? '<span class="badge badge-info">trial</span>' : "") +
            "</div>" +
            '<div class="key-card-meta">' +
              '<span class="meta-item">' + esc(k.modDisplayName || k.modName || "—") + "</span>" +
              '<span class="meta-item">📱 ' + deviceCount(k) + "/" + esc(String(k.access != null ? k.access : "—")) + "</span>" +
              '<span class="meta-item ' + (expired ? "is-dead" : (isTrial ? "is-trial" : "")) + '">' + validityLabel + "</span>" +
              '<span class="meta-item muted">' + esc(k.sellerName || "—") + "</span>" +
            "</div>" +
            '<div class="key-card-actions">' + actions + "</div>" +
          "</article>"
        );
      }).join("");

      if (pagination) {
        pagination.innerHTML = state.totalPages > 1
          ? '<span class="page-info">Page ' + state.page + " of " + state.totalPages + "</span>" +
            '<div class="page-btns">' +
              '<button class="btn btn-sm" type="button"' + (state.page === 1 ? " disabled" : "") + ' onclick="prevPage()">Previous</button>' +
              '<button class="btn btn-sm" type="button"' + (state.page === state.totalPages ? " disabled" : "") + ' onclick="nextPage()">Next</button>' +
            "</div>"
          : "";
      }

      if (bulkBar) {
        if (canManage && state.selected.size > 0) {
          bulkBar.hidden = false;
          bulkBar.innerHTML =
            '<strong>' + state.selected.size + " selected</strong>" +
            '<button class="btn btn-sm" type="button" onclick="bulkAction(\'extend\',\'7d\')">+7 days</button>' +
            '<button class="btn btn-sm" type="button" onclick="bulkAction(\'pause\')">Pause</button>' +
            '<button class="btn btn-sm" type="button" onclick="bulkAction(\'ban\')">Ban</button>' +
            '<button class="btn btn-sm" type="button" onclick="bulkAction(\'unban\')">Unban</button>' +
            '<button class="btn btn-sm btn-danger" type="button" onclick="bulkAction(\'delete\')">Delete</button>' +
            '<button class="btn btn-sm" type="button" onclick="state.selected.clear();renderTable()">Clear</button>';
        } else {
          bulkBar.innerHTML = "";
          bulkBar.hidden = true;
        }
      }
    }

    function toggleSelect(id, checked) {
      if (checked) state.selected.add(id); else state.selected.delete(id);
      renderTable();
    }
    function prevPage() { if (state.page > 1) { state.page--; loadKeys(); } }
    function nextPage() { if (state.page < state.totalPages) { state.page++; loadKeys(); } }

    async function pauseKey(id) {
      var r = prompt("Pause reason?"); if (r === null) return;
      try { await api("/keys/" + id + "/pause", { method: "POST", body: { reason: r || "Paused" } }); showToast("Paused"); loadKeys(); }
      catch (e) { showToast(e.message, "error"); }
    }
    async function resumeKey(id) {
      try { await api("/keys/" + id + "/resume", { method: "POST" }); showToast("Resumed"); loadKeys(); }
      catch (e) { showToast(e.message, "error"); }
    }
    async function banKey(id) {
      var r = prompt("Ban reason?"); if (r === null) return;
      try { await api("/keys/" + id + "/ban", { method: "POST", body: { reason: r || "Banned" } }); showToast("Banned"); loadKeys(); }
      catch (e) { showToast(e.message, "error"); }
    }
    async function unbanKey(id) {
      try { await api("/keys/" + id + "/unban", { method: "POST" }); showToast("Unbanned"); loadKeys(); }
      catch (e) { showToast(e.message, "error"); }
    }
    async function deleteKey(id) {
      if (!confirm("Permanently delete this key? This cannot be undone.")) return;
      try { await api("/keys/" + id + "/delete", { method: "POST" }); showToast("Deleted"); loadKeys(); }
      catch (e) { showToast(e.message, "error"); }
    }
    function toggleSelectAllPage() {
      var allSelected = state.keys.length > 0 && state.keys.every(function (k) { return state.selected.has(k.id); });
      if (allSelected) state.keys.forEach(function (k) { state.selected.delete(k.id); });
      else state.keys.forEach(function (k) { state.selected.add(k.id); });
      renderTable();
    }
    async function bulkAction(action, duration) {
      if (!state.selected.size) return;
      if (!confirm(action + " " + state.selected.size + " key(s)?")) return;
      try {
        var body = { ids: Array.from(state.selected), action: action };
        if (duration) body.duration = "+" + duration;
        var res = await api("/keys/bulk", { method: "POST", body: body });
        showToast((res.processed || 0) + " processed");
        state.selected.clear();
        loadKeys();
      } catch (e) { showToast(e.message, "error"); }
    }
    function exportCsv() {
      var params = new URLSearchParams();
      if (state.mod !== "all") params.set("mod", state.mod);
      if (state.status !== "all") params.set("status", state.status);
      fetch(API_BASE + "/api/admin/keys/export?" + params.toString(), { headers: { Authorization: "Bearer " + getToken() } })
        .then(function (r) { return r.blob(); })
        .then(function (blob) {
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url; a.download = "keys-" + new Date().toISOString().slice(0, 10) + ".csv";
          document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        })
        .catch(function (e) { showToast(e.message, "error"); });
    }
  </script>
</body>
</html>
