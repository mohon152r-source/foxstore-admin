<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline';
  img-src 'self' https: data:;
  connect-src 'self' https: http://localhost:* http://127.0.0.1:*;
">
  <title>Fox Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="layout">
    <div class="empty" style="padding-top:30vh"><span class="spinner"></span></div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    /**
     * Entry shell — auth then land on dashboard.
     * Shared structure (header card + bottom nav + page-content) lives in app.js mountShell(),
     * used by every page HTML module under this folder
     */
    if (!getToken()) {
      window.location.replace("login.html");
    } else {
      checkAuth().then(function (user) {
        if (!user) {
          clearToken();
          window.location.replace("login.html");
        } else {
          window.location.replace("dashboard.html");
        }
      });
    }
  </script>
</body>
</html>
