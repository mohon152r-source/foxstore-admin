<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline';
  img-src 'self' https: data:;
  connect-src 'self' https: http://localhost:* http://127.0.0.1:*;
">
  <title>Sellers — Fox Store</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .seller-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 12px;
    }
    .seller-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .seller-card:hover { border-color: var(--primary); }
    .seller-card.selected { border-color: var(--primary); }
    .seller-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .seller-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }
    .seller-name {
      font-weight: 600;
      font-size: 14px;
    }
    .seller-role {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
    }
    .seller-balance {
      font-size: 13px;
      margin-bottom: 10px;
    }
    .seller-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
    .status-dot.on { background: #34d399; }
    .status-dot.off { background: #f87171; }
  </style>
</head>
<body>
  <div id="app" class="layout"></div>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    var sellers = [];
    var isRulerUser = false;

    requireAuth();
    document.addEventListener("auth-ready", function () {
      if (!isManager()) {
        mountShell("Sellers");
        document.getElementById("page-content").innerHTML = '<div class="empty">Forbidden</div>';
        return;
      }
      
      isRulerUser = isRuler();
      mountShell("Sellers");
      document.getElementById("page-content").innerHTML =
        '<div class="page-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">' +
          '<div><h1>Sellers</h1><p>Resellers &amp; superadmins</p></div>' +
          (isRulerUser ? '<button class="btn btn-primary" type="button" onclick="showCreateForm()">+ Add Seller</button>' : '') +
        '</div>' +
        '<div id="formContainer"></div>' +
        '<div id="content" class="seller-grid"><div class="empty"><span class="spinner"></span></div></div>';
      
      loadResellers();
    });

    async function loadResellers() {
      var box = document.getElementById("content");
      try {
        var res = await api("/resellers");
        sellers = res.data || [];
        renderSellers();
      } catch (e) {
        box.innerHTML = '<div class="empty" style="color:var(--danger)">' + esc(e.message) + '</div>';
      }
    }

    function renderSellers() {
      var box = document.getElementById("content");
      if (!sellers.length) {
        box.innerHTML = '<div class="empty">No sellers found.</div>';
        return;
      }
      
      box.className = "seller-grid";
      box.innerHTML = sellers.map(function (r) {
        var active = r.isActive !== false;
        var avatar = (r.avatarUrl && String(r.avatarUrl).trim()) ? r.avatarUrl : DEFAULT_AVATAR;
        var balance = formatMoney(r.balance || 0);
        var isSelf = window.__user && String(r.id) === String(window.__user.id);
        
        var actions = "";
        if (!isSelf && isRulerUser) {
          actions =
            '<button class="btn btn-sm" type="button" onclick="event.stopPropagation();rechargeReseller(\'' + esc(r.id) + '\',\'' + esc(r.username) + '\')">+ Bal</button>' +
            '<button class="btn btn-sm" type="button" onclick="event.stopPropagation();toggleActive(\'' + esc(r.id) + '\',' + (active ? "false" : "true") + ')">' +
              (active ? "Disable" : "Activate") + '</button>' +
            '<button class="btn btn-sm btn-danger" type="button" onclick="event.stopPropagation();deleteReseller(\'' + esc(r.id) + '\',\'' + esc(r.username) + '\')">Delete</button>';
        }

        return (
          '<div class="seller-card" onclick="zoomSeller(\'' + esc(r.id) + '\')">' +
            '<div class="seller-top">' +
              '<img class="seller-avatar" src="' + esc(avatar) + '" alt="" onerror="this.onerror=null;this.src=DEFAULT_AVATAR">' +
              '<div>' +
                '<div class="seller-name">' +
                  '<span class="status-dot ' + (active ? "on" : "off") + '"></span>' +
                  esc(r.username) +
                '</div>' +
                '<div class="seller-role">' + esc(r.role || "reseller") + '</div>' +
              '</div>' +
            '</div>' +
            '<div class="seller-balance">Balance: <strong>' + esc(balance) + '</strong></div>' +
            (actions ? '<div class="seller-actions" onclick="event.stopPropagation()">' + actions + '</div>' : '') +
          '</div>'
        );
      }).join("");
    }

    async function zoomSeller(id) {
      try {
        var res = await api("/resellers/" + encodeURIComponent(id) + "/zoom");
        var d = res.data || {};
        var u = d.user || d;
        
        if (!u || !u.id) throw new Error("Seller not found");
        
        var keys = d.keys || [];
        var transactions = d.transactions || [];
        var audits = d.audits || [];
        
        var alertHtml = 
          "Seller: " + (u.username || "Unknown") + "\n" +
          "Role: " + (u.role || "reseller") + "\n" +
          "Status: " + (u.isActive !== false ? "Active" : "Disabled") + "\n" +
          "Balance: " + formatMoney(u.balance || 0) + "\n\n" +
          "Total Keys: " + keys.length + "\n" +
          "Transactions: " + transactions.length + "\n" +
          "Audit Logs: " + audits.length;
        
        alert(alertHtml);
      } catch (e) {
        showToast(e.message || "Failed to load seller", "error");
      }
    }

    function showCreateForm() {
      if (!isRulerUser) return;
      
      var formContainer = document.getElementById("formContainer");
      formContainer.innerHTML =
        '<div class="card" style="margin-bottom:12px">' +
          '<div class="card-header"><h2>Add Seller</h2></div>' +
          '<div class="card-body">' +
            '<form id="createForm">' +
              '<div class="form-group">' +
                '<label>Username</label>' +
                '<input type="text" id="newUsername" required>' +
              '</div>' +
              '<div class="form-group">' +
                '<label>Password</label>' +
                '<input type="password" id="newPassword" required minlength="4" placeholder="Min 4 characters">' +
              '</div>' +
              '<div style="display:flex;gap:8px">' +
                '<button type="submit" class="btn btn-primary">Create</button>' +
                '<button type="button" class="btn" onclick="document.getElementById(\'formContainer\').innerHTML=\'\'">Cancel</button>' +
              '</div>' +
            '</form>' +
          '</div>' +
        '</div>';
      
      document.getElementById("createForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        try {
          await api("/resellers", { 
            method: "POST", 
            body: {
              username: document.getElementById("newUsername").value.trim(),
              password: document.getElementById("newPassword").value
            } 
          });
          showToast("Seller created");
          document.getElementById("formContainer").innerHTML = "";
          loadResellers();
        } catch (err) { 
          showToast(err.message, "error"); 
        }
      });
    }

    async function rechargeReseller(id, username) {
      var amount = prompt("Recharge amount for " + username + " (BDT):");
      if (!amount || isNaN(parseFloat(amount)) || parseFloat(amount) <= 0) {
        showToast("Invalid amount", "error");
        return;
      }
      
      try {
        await api("/resellers/" + id + "/recharge", { 
          method: "POST", 
          body: { amount: parseFloat(amount) } 
        });
        showToast("Recharged " + amount + " BDT");
        loadResellers();
      } catch (e) { 
        showToast(e.message, "error"); 
      }
    }

    async function toggleActive(id, active) {
      try {
        await api("/resellers/" + id, { 
          method: "PATCH", 
          body: { isActive: active } 
        });
        showToast(active ? "Activated" : "Disabled");
        loadResellers();
      } catch (e) { 
        showToast(e.message, "error"); 
      }
    }

    async function deleteReseller(id, username) {
      if (!confirm("Delete " + username + " and all their keys? This cannot be undone.")) return;
      
      try {
        await api("/resellers/" + id, { method: "DELETE" });
        showToast(username + " deleted");
        loadResellers();
      } catch (e) { 
        showToast(e.message, "error"); 
      }
    }

    // Global functions
    window.loadResellers = loadResellers;
    window.zoomSeller = zoomSeller;
    window.showCreateForm = showCreateForm;
    window.rechargeReseller = rechargeReseller;
    window.toggleActive = toggleActive;
    window.deleteReseller = deleteReseller;
  </script>
</body>
</html>
