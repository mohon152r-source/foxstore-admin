<<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline';
  img-src 'self' https: data:;
  connect-src 'self' https: http://localhost:* http://127.0.0.1:*;
">
  <title>Key Detail — Fox Store</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .tabs { 
      display: flex; 
      gap: 0; 
      border-bottom: 1px solid var(--border); 
      margin-bottom: 16px; 
      overflow-x: auto; 
    }
    .tab {
      padding: 10px 16px; 
      cursor: pointer; 
      border-bottom: 2px solid transparent;
      color: var(--muted); 
      font-size: 13px; 
      white-space: nowrap; 
      background: none; 
      border-top: none; 
      border-left: none; 
      border-right: none;
    }
    .tab.active { 
      color: var(--primary); 
      border-bottom-color: var(--primary); 
      font-weight: 600; 
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .detail-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .detail-head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .key-code-display {
      font-size: 20px;
      font-weight: 700;
      word-break: break-all;
      color: var(--primary);
      font-family: monospace;
    }
    .snap-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .snap-cell {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
    }
    .snap-cell .k { 
      font-size: 10px; 
      color: var(--muted); 
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .snap-cell .v { 
      font-size: 16px; 
      font-weight: 700; 
    }
    
    .kv {
      display: flex; 
      justify-content: space-between; 
      gap: 12px;
      padding: 10px 0; 
      border-bottom: 1px solid var(--border); 
      font-size: 13px;
    }
    .kv:last-child { border-bottom: none; }
    .kv .k { color: var(--muted); flex-shrink: 0; }
    .kv .v { text-align: right; word-break: break-all; color: var(--fg); }
    
    .action-grid { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 8px; 
      margin-bottom: 16px;
    }
    
    .status-dot {
      width: 8px; 
      height: 8px; 
      border-radius: 50%; 
      display: inline-block; 
      margin-right: 6px;
      background: var(--muted);
    }
    .status-dot.on { background: #34d399; box-shadow: 0 0 8px #34d39988; }
    .status-dot.warn { background: #fbbf24; }
    .status-dot.off { background: #f87171; }
    
    .device-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .device-card.is-banned {
      border-color: rgba(239, 68, 68, 0.5);
      background: rgba(239, 68, 68, 0.05);
    }
    .log-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .log-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .log-action {
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
    }
    .log-time {
      font-size: 11px;
      color: var(--muted);
    }
    .log-who {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .log-body {
      font-size: 12px;
      color: var(--fg);
    }
  </style>
</head>
<body>
  <div id="app" class="layout"></div>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    var keyId = new URLSearchParams(window.location.search).get("id");
    var keyData = null;
    var canManage = false;

    function rowHtml(label, valueHtml) {
      return '<div class="kv"><span class="k">' + esc(label) + '</span><span class="v">' + valueHtml + '</span></div>';
    }

    function statusColor(st) {
      st = String(st || "").toLowerCase();
      if (st === "active") return "#34d399";
      if (st === "paused") return "#fbbf24";
      if (st === "banned" || st === "revoked") return "#f87171";
      if (st === "expired") return "#a1a1aa";
      return "var(--fg)";
    }

    function statusDotClass(st) {
      st = String(st || "").toLowerCase();
      if (st === "active") return "on";
      if (st === "paused") return "warn";
      return "off";
    }

    function showTab(name) {
      document.querySelectorAll(".tab").forEach(function (t) { t.classList.remove("active"); });
      document.querySelectorAll(".tab-content").forEach(function (t) { t.classList.remove("active"); });
      
      var tabMap = { general: 0, devices: 1, security: 2, logs: 3 };
      var tabs = document.querySelectorAll(".tab");
      if (tabs[tabMap[name]]) tabs[tabMap[name]].classList.add("active");
      
      var el = document.getElementById("tab-" + name);
      if (el) el.classList.add("active");
    }

    requireAuth();
    document.addEventListener("auth-ready", function () {
      canManage = isManager();
      if (!keyId) { window.location.href = "keys.html"; return; }
      mountShell("Keys");
      document.getElementById("page-content").innerHTML = '<div class="empty"><span class="spinner"></span></div>';
      loadKey();
    });

    async function loadKey() {
      var root = document.getElementById("page-content");
      try {
        var res = await api("/keys/" + encodeURIComponent(keyId));
        keyData = res.data || {};
        var k = keyData;
        
        var days = k.expiresAt ? daysUntil(k.expiresAt) : null;
        var isTrial = k.keyType === "trial";
        var stColor = statusColor(k.status);
        var accessLabel = (k.access === -1 || k.access >= 9999) ? "Unlimited" : String(k.access || 1);

        // Actions
        var actParts = [];
        
        if (canManage) {
          if (k.status === "paused") {
            actParts.push('<button class="btn btn-sm" style="color:var(--success)" type="button" onclick="resumeKey()">Resume</button>');
          } else if (k.status !== "banned") {
            actParts.push('<button class="btn btn-sm" style="color:var(--warning)" type="button" onclick="pauseKey()">Pause</button>');
          }
          
          if (k.status === "banned") {
            actParts.push('<button class="btn btn-sm" style="color:var(--success)" type="button" onclick="unbanKey()">Unban</button>');
          } else {
            actParts.push('<button class="btn btn-sm" style="color:var(--danger)" type="button" onclick="banKey()">Ban</button>');
          }
          
          actParts.push('<button class="btn btn-sm" type="button" onclick="hwidReset()">Reset HWID</button>');
          actParts.push('<button class="btn btn-sm btn-danger" type="button" onclick="deleteKey()">Delete</button>');
        }

        // Validity adjustment
        actParts.push(
          '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">' +
            '<input type="number" id="validityDays" value="0" min="0" style="width:60px;padding:6px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--fg)"> days' +
            '<button class="btn btn-sm btn-primary" type="button" onclick="adjustValidity(1)">Extend</button>' +
            '<button class="btn btn-sm" type="button" onclick="adjustValidity(-1)" style="border-color:rgba(251,191,36,0.5);color:#fbbf24">Reduce</button>' +
          '</div>'
        );

        var actionsHtml = actParts.length
          ? '<div class="action-grid">' + actParts.join("") + '</div>'
          : '';

        // Devices
        var devices = k.devices || [];
        var deviceList = devices.length === 0
          ? '<div class="empty">No devices bound yet.</div>'
          : devices.map(function (d) {
              var deviceId = typeof d === 'string' ? d : (d.deviceId || d.device_id || 'Unknown');
              var deviceName = typeof d === 'string' ? '' : (d.deviceName || d.device_name || '');
              var lastActive = typeof d === 'string' ? '' : (d.lastActive || d.last_active || d.lastSeenAt || '');
              var isBanned = typeof d === 'object' && (d.isBanned || d.is_banned);
              
              return '<div class="device-card' + (isBanned ? " is-banned" : "") + '">' +
                '<div style="flex:1;min-width:0">' +
                  '<code style="font-size:12px">' + esc(deviceId) + '</code>' +
                  (isBanned ? ' <span class="badge badge-banned">banned</span>' : '') +
                  (deviceName ? '<div style="font-size:11px;color:var(--muted);margin-top:4px">' + esc(deviceName) + '</div>' : '') +
                  (lastActive ? '<div style="font-size:11px;color:var(--muted)">Last: ' + esc(formatDate(lastActive)) + '</div>' : '') +
                '</div>' +
              '</div>';
            }).join("");

        root.innerHTML =
          '<div style="margin-bottom:12px">' +
            '<a href="keys.html" style="font-size:13px;color:var(--muted)">← Back to keys</a>' +
          '</div>' +

          '<div class="detail-panel">' +
            '<div class="detail-head">' +
              '<div style="flex:1;min-width:0">' +
                '<div style="font-size:11px;color:var(--muted);margin-bottom:4px">LICENSE KEY</div>' +
                '<div class="key-code-display">' + esc(k.key || "—") + '</div>' +
                '<div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center">' +
                  '<span class="badge" style="color:' + stColor + ';border:1px solid ' + stColor + '55;padding:4px 10px;border-radius:6px">' +
                    '<span class="status-dot ' + statusDotClass(k.status) + '"></span>' + esc(k.status || "—") +
                  '</span>' +
                  (isTrial
                    ? '<span class="badge badge-info">Trial</span>'
                    : '<span class="badge badge-info">Regular</span>') +
                  '<span style="font-size:12px;color:var(--muted)">' + esc(k.modName || k.modDisplayName || "—") + '</span>' +
                '</div>' +
              '</div>' +
              '<button class="btn btn-sm btn-primary" type="button" onclick="copyKey()">Copy</button>' +
            '</div>' +
            
            '<div class="snap-grid">' +
              '<div class="snap-cell">' +
                '<div class="k">Devices</div>' +
                '<div class="v" style="color:#38bdf8">' + esc(String(devices.length)) + ' / ' + esc(accessLabel) + '</div>' +
              '</div>' +
              '<div class="snap-cell">' +
                '<div class="k">' + (isTrial ? "Duration" : "Expires") + '</div>' +
                '<div class="v" style="color:' + (days !== null && days <= 0 ? "var(--danger)" : "var(--fg)") + '">' +
                  esc(isTrial ? (k.trialDuration || k.duration || "—") : (k.expiresAt ? formatDate(k.expiresAt) : "—")) +
                '</div>' +
              '</div>' +
              '<div class="snap-cell">' +
                '<div class="k">Status</div>' +
                '<div class="v" style="color:' + stColor + '">' + esc(k.status || "—") + '</div>' +
              '</div>' +
              '<div class="snap-cell">' +
                '<div class="k">Created</div>' +
                '<div class="v" style="font-size:13px">' + esc(k.createdAt ? formatDate(k.createdAt) : "—") + '</div>' +
              '</div>' +
            '</div>' +
          '</div>' +

          actionsHtml +

          '<div class="tabs">' +
            '<button type="button" class="tab active" onclick="showTab(\'general\')">General</button>' +
            '<button type="button" class="tab" onclick="showTab(\'devices\')">Devices (' + esc(String(devices.length)) + ')</button>' +
            '<button type="button" class="tab" onclick="showTab(\'security\')">Security</button>' +
            '<button type="button" class="tab" onclick="showTab(\'logs\')">Logs</button>' +
          '</div>' +

          '<div id="tab-general" class="tab-content active">' +
            '<div class="card"><div class="card-body">' +
              rowHtml("Status", '<span style="color:' + stColor + ';font-weight:600">' + esc(k.status || "—") + '</span>') +
              rowHtml("Type", isTrial ? "Trial" : "Regular") +
              rowHtml("App", esc(k.modName || k.modDisplayName || "—")) +
              rowHtml("Max devices", esc(accessLabel)) +
              rowHtml("Expires", isTrial ? 'Per device on first login' : esc(k.expiresAt ? formatDate(k.expiresAt) : "—")) +
              rowHtml("Created", esc(k.createdAt ? formatDate(k.createdAt) : "—")) +
              rowHtml("Key ID", '<code style="font-size:11px;color:var(--muted)">' + esc(k.id || "") + '</code>') +
            '</div></div>' +
          '</div>' +

          '<div id="tab-devices" class="tab-content">' +
            '<div class="card"><div class="card-body">' + deviceList + '</div></div>' +
          '</div>' +

          '<div id="tab-security" class="tab-content">' +
            '<div class="card"><div class="card-body">' +
              rowHtml("HWID resets", esc(String(k.resetCount || 0))) +
              rowHtml("Pause reason", esc(k.pauseReason || "—")) +
              rowHtml("Ban reason", esc(k.banReason || "—")) +
            '</div></div>' +
          '</div>' +

          '<div id="tab-logs" class="tab-content">' +
            '<div class="card"><div class="card-body"><div id="keyLogs"><div class="empty"><span class="spinner"></span></div></div></div></div>' +
          '</div>';

        loadKeyLogs();
      } catch (e) {
        root.innerHTML = '<div class="alert alert-error">' + esc(e.message || String(e)) + '</div>';
      }
    }

    async function loadKeyLogs() {
      var el = document.getElementById("keyLogs");
      if (!el) return;
      
      try {
        var res = await api("/keys/" + encodeURIComponent(keyId) + "/logs");
        var logs = res.data || [];
        
        if (!logs.length) {
          el.innerHTML = '<div class="empty">No logs yet.</div>';
          return;
        }
        
        el.innerHTML = logs.map(function (l) {
          var action = (l.action || l.type || "log").toString();
          var when = l.createdAt || l.timestamp || l.time || "";
          var details = l.details || l.message || "";
          
          if (typeof details === "object") {
            try { details = JSON.stringify(details); } catch (e) { details = String(details); }
          }
          
          var color = "#94a3b8";
          var a = action.toLowerCase();
          if (/creat|generat|extend|activ|resume|unban|success/.test(a)) color = "#34d399";
          else if (/pause|reduc|warn/.test(a)) color = "#fbbf24";
          else if (/ban|delete|fail|error|revok/.test(a)) color = "#f87171";
          else if (/login|bind|device/.test(a)) color = "#60a5fa";
          
          return '<div class="log-card" style="border-left:3px solid ' + color + '">' +
            '<div class="log-card-top">' +
              '<span class="log-action" style="color:' + color + '">' + esc(action) + '</span>' +
              '<span class="log-time">' + esc(when ? formatDate(when) : "—") + '</span>' +
            '</div>' +
            (details ? '<div class="log-body">' + esc(String(details)) + '</div>' : '') +
          '</div>';
        }).join("");
      } catch (e) {
        if (el) el.innerHTML = '<div class="empty">' + esc(e.message || String(e)) + '</div>';
      }
    }

    function copyKey() {
      if (keyData && keyData.key) copyToClipboard(keyData.key);
    }
    
    async function adjustValidity(sign) {
      var days = parseInt(document.getElementById("validityDays").value || "0", 10) || 0;
      
      if (days <= 0) { showToast("Enter days", "error"); return; }
      
      var isReduce = sign < 0;
      var label = days + "d";
      
      if (isReduce && !confirm("Reduce validity by " + label + "?")) return;
      
      try {
        var endpoint = isReduce ? "/reduce" : "/extend";
        await api("/keys/" + keyId + endpoint, { 
          method: "POST", 
          body: { days: days } 
        });
        
        showToast((isReduce ? "Reduced −" : "Extended +") + label, "success");
        loadKey();
      } catch (e) {
        showToast(e.message, "error");
      }
    }

    async function pauseKey() {
      if (!confirm("Pause this key?")) return;
      try {
        await api("/keys/" + keyId + "/pause", { method: "POST" });
        showToast("Paused"); 
        loadKey();
      } catch (e) { showToast(e.message, "error"); }
    }
    
    async function resumeKey() {
      try { 
        await api("/keys/" + keyId + "/resume", { method: "POST" }); 
        showToast("Resumed"); 
        loadKey(); 
      }
      catch (e) { showToast(e.message, "error"); }
    }
    
    async function banKey() {
      if (!confirm("Ban this key?")) return;
      try {
        await api("/keys/" + keyId + "/ban", { method: "POST" });
        showToast("Banned"); 
        loadKey();
      } catch (e) { showToast(e.message, "error"); }
    }
    
    async function unbanKey() {
      try { 
        await api("/keys/" + keyId + "/unban", { method: "POST" }); 
        showToast("Unbanned"); 
        loadKey(); 
      }
      catch (e) { showToast(e.message, "error"); }
    }
    
    async function hwidReset() {
      if (!confirm("Reset all device bindings?")) return;
      try { 
        await api("/keys/" + keyId + "/hwid-reset", { method: "POST" }); 
        showToast("HWID reset"); 
        loadKey(); 
      }
      catch (e) { showToast(e.message, "error"); }
    }
    
    async function deleteKey() {
      if (!confirm("Permanently delete this key? This cannot be undone.")) return;
      try {
        await api("/keys/" + keyId + "/delete", { method: "DELETE" });
        showToast("Key deleted");
        setTimeout(function () { window.location.href = "keys.html"; }, 600);
      } catch (e) { showToast(e.message, "error"); }
    }
  </script>
</body>
</html>
