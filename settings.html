<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline';
  img-src 'self' https: data:;
  connect-src 'self' https: http://localhost:* http://127.0.0.1:*;
">
  <title>Me — Fox Store</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .me-page { max-width: 720px; margin: 0 auto; padding-bottom: 24px; }

    .me-hero {
      display: flex; align-items: center; gap: 14px;
      padding: 16px; margin-bottom: 14px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border);
    }
    .me-hero-avatar {
      width: 64px; height: 64px; border-radius: 18px;
      object-fit: cover; flex-shrink: 0;
      border: 2px solid var(--border);
      background: var(--bg);
    }
    .me-hero-meta { min-width: 0; flex: 1; }
    .me-hero-name {
      font-size: 18px; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .me-hero-role {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 4px; padding: 3px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 650; text-transform: uppercase;
      background: rgba(99,102,241,0.1); color: var(--primary);
    }
    .me-hero-bal {
      margin-top: 8px; font-size: 13px; color: var(--muted);
    }
    .me-hero-bal strong { color: var(--fg); font-weight: 700; }

    .me-stack { display: flex; flex-direction: column; gap: 12px; }

    .me-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .me-section-head {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    .me-section-head h2 {
      font-size: 13px; font-weight: 700;
      text-transform: uppercase; color: var(--muted);
      margin: 0;
    }
    .me-section-body { padding: 14px; }

    .form-group { margin-bottom: 12px; }
    .form-group:last-child { margin-bottom: 0; }
    .form-group label {
      display: block; font-size: 11px; font-weight: 650;
      color: var(--muted); text-transform: uppercase;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      font-size: 14px;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .me-actions {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-top: 14px;
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
      border: none;
    }
    .btn-block {
      width: 100%;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div id="app" class="layout"></div>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    requireAuth();
    document.addEventListener("auth-ready", function () {
      try {
        var user = window.__user || {};
        var currentAvatar = user.avatarUrl || DEFAULT_AVATAR;
        var isRulerUser = user.role === "ruler";
        var wallet = window.__wallet || {};
        var balText = typeof formatMoney === "function"
          ? formatMoney(wallet.balance || 0)
          : String(wallet.balance || 0);

        mountShell("Me");
        var root = document.getElementById("page-content");
        if (!root) return;

        var html =
          '<div class="me-page">' +
            '<div class="page-header"><h1>Settings</h1><p>Profile, security &amp; preferences</p></div>' +

            '<div class="me-hero">' +
              '<img class="me-hero-avatar" id="avatarPreview" src="' + esc(currentAvatar) + '" alt="" onerror="this.onerror=null;this.src=DEFAULT_AVATAR">' +
              '<div class="me-hero-meta">' +
                '<div class="me-hero-name">' + esc(user.username || "") + '</div>' +
                '<span class="me-hero-role">' + esc(user.role || "") + '</span>' +
                '<div class="me-hero-bal">Balance: <strong>' + esc(balText) + '</strong></div>' +
              '</div>' +
            '</div>' +

            '<div class="me-stack">' +

              // Profile Section
              '<section class="me-section">' +
                '<div class="me-section-head"><h2>Profile</h2></div>' +
                '<div class="me-section-body">' +
                  '<div class="form-group">' +
                    '<label>Avatar URL</label>' +
                    '<input type="url" id="avatarUrl" placeholder="https://…" value="' + esc(user.avatarUrl || "") + '">' +
                  '</div>' +
                  '<div class="me-actions">' +
                    '<button type="button" class="btn btn-primary" id="avatarBtn" onclick="saveAvatar()">Save Avatar</button>' +
                  '</div>' +
                '</div>' +
              '</section>';

        // Branding Section (Ruler only)
        if (isRulerUser) {
          html +=
            '<section class="me-section">' +
              '<div class="me-section-head"><h2>Branding</h2></div>' +
              '<div class="me-section-body">' +
                '<div class="form-group">' +
                  '<label>Brand Name</label>' +
                  '<input type="text" id="brandName" value="' + esc((window.__brand && window.__brand.name) || "Fox Store") + '">' +
                '</div>' +
                '<div class="form-group">' +
                  '<label>Logo URL</label>' +
                  '<input type="url" id="brandLogo" placeholder="https://…" value="' + esc((window.__brand && window.__brand.logoUrl) || "") + '">' +
                '</div>' +
                '<div class="me-actions">' +
                  '<button type="button" class="btn btn-primary" onclick="saveBranding()">Save Branding</button>' +
                '</div>' +
              '</div>' +
            '</section>';
        }

        // Password Section
        html +=
          '<section class="me-section">' +
            '<div class="me-section-head"><h2>Change Password</h2></div>' +
            '<div class="me-section-body">' +
              '<div class="form-group">' +
                '<label>Current Password</label>' +
                '<input type="password" id="currentPassword" placeholder="Enter current password">' +
              '</div>' +
              '<div class="form-group">' +
                '<label>New Password</label>' +
                '<input type="password" id="newPassword" placeholder="Enter new password">' +
              '</div>' +
              '<div class="form-group">' +
                '<label>Confirm New Password</label>' +
                '<input type="password" id="confirmPassword" placeholder="Confirm new password">' +
              '</div>' +
              '<div class="me-actions">' +
                '<button type="button" class="btn btn-primary" id="passwordBtn" onclick="changePassword()">Change Password</button>' +
              '</div>' +
            '</div>' +
          '</section>' +

          // Logout Section
          '<section class="me-section">' +
            '<div class="me-section-body">' +
              '<button type="button" class="btn btn-danger btn-block" onclick="logout()">Logout</button>' +
            '</div>' +
          '</section>' +

        '</div>' +
      '</div>';

        root.innerHTML = html;
        if (typeof bindPasswordToggles === "function") bindPasswordToggles(root);

        // Avatar preview
        document.getElementById("avatarUrl").addEventListener("input", function () {
          document.getElementById("avatarPreview").src = this.value.trim() || DEFAULT_AVATAR;
        });

      } catch (err) {
        console.error("settings render", err);
        var root2 = document.getElementById("page-content") || document.getElementById("app");
        if (root2) {
          root2.innerHTML = '<div class="card"><div class="card-body" style="color:var(--danger)">Settings failed: ' +
            esc(err && err.message ? err.message : String(err)) + '</div></div>';
        }
      }
    });

    async function saveAvatar() {
      var avatarUrl = document.getElementById("avatarUrl").value.trim();
      try {
        await api("/auth/profile", {
          method: "PATCH",
          body: { avatarUrl: avatarUrl }
        });
        showToast("Avatar saved");
        setTimeout(function() { location.reload(); }, 500);
      } catch (err) {
        showToast(err.message || "Failed to save", "error");
      }
    }

    async function saveBranding() {
      var brandName = document.getElementById("brandName").value.trim();
      var logoUrl = document.getElementById("brandLogo").value.trim();
      
      try {
        await api("/settings/branding", {
          method: "POST",
          body: { 
            brandName: brandName,
            logoUrl: logoUrl
          }
        });
        showToast("Branding saved");
        setTimeout(function() { location.reload(); }, 500);
      } catch (err) {
        showToast(err.message || "Failed to save branding", "error");
      }
    }

    async function changePassword() {
      var currentPassword = document.getElementById("currentPassword").value;
      var newPassword = document.getElementById("newPassword").value;
      var confirmPassword = document.getElementById("confirmPassword").value;
      
      if (!currentPassword || !newPassword || !confirmPassword) {
        showToast("Please fill all fields", "error");
        return;
      }
      
      if (newPassword !== confirmPassword) {
        showToast("Passwords don't match", "error");
        return;
      }
      
      if (newPassword.length < 4) {
        showToast("Password too short (min 4 characters)", "error");
        return;
      }
      
      try {
        await api("/auth/change-password", {
          method: "POST",
          body: {
            currentPassword: currentPassword,
            newPassword: newPassword
          }
        });
        showToast("Password changed. Please login again.");
        setTimeout(function() { 
          clearToken();
          window.location.href = "login.html"; 
        }, 1000);
      } catch (err) {
        showToast(err.message || "Failed to change password", "error");
      }
    }
  </script>
</body>
</html>
