<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline';
  img-src 'self' https: data:;
  connect-src 'self' https: http://localhost:* http://127.0.0.1:*;
">
  <title>Dashboard â€” Fox Store</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .dash-qa {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px; margin-bottom: 14px;
    }
    @media (max-width: 720px) {
      .dash-qa { grid-template-columns: repeat(2, 1fr); }
    }
    .dash-qa a {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--card);
      text-decoration: none; color: var(--fg); font-size: 12px; font-weight: 600;
    }
    .dash-qa a:hover { border-color: var(--primary); text-decoration: none; }
    .dash-qa .ico {
      width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 14px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px; margin-bottom: 14px;
    }
    @media (max-width: 900px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .stat-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px;
      text-decoration: none; color: inherit; display: block;
    }
    .stat-card.clickable:hover { border-color: var(--primary); }
    .stat-card .label {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--muted); font-weight: 600;
    }
    .stat-card .value {
      font-size: 22px; font-weight: 750; letter-spacing: -0.03em;
      margin-top: 2px; line-height: 1.15;
    }
    .stat-card .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .dash-row {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 12px; margin-bottom: 12px;
    }
    @media (max-width: 800px) {
      .dash-row { grid-template-columns: 1fr; }
    }
    .dash-panel {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px 14px; min-width: 0;
    }
    .dash-panel-h {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-bottom: 10px; flex-wrap: wrap;
    }
    .dash-panel-h h2 {
      margin: 0; font-size: 13px; font-weight: 650;
      letter-spacing: -0.01em;
    }
    .dash-panel-h .meta { font-size: 11px; color: var(--muted); }

    .bar-chart {
      display: flex; align-items: flex-end; gap: 4px;
      height: 140px; width: 100%;
    }
    .bar-chart .bar-col {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; height: 100%; justify-content: flex-end; min-width: 0;
    }
    .bar-chart .bar {
      width: 100%; max-width: 22px;
      background: linear-gradient(180deg, #a5b4fc, #6366f1 55%, #4f46e5);
      border-radius: 4px 4px 2px 2px; min-height: 2px;
    }
    .bar-chart .bar-val { font-size: 9px; color: var(--muted); margin-bottom: 2px; }
    .bar-chart .label { font-size: 9px; color: var(--muted); margin-top: 4px; white-space: nowrap; }

    .donut-wrap { display: flex; justify-content: center; padding: 4px 0 8px; }
    .donut {
      width: 110px; height: 110px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .donut-inner {
      width: 62px; height: 62px; border-radius: 50%;
      background: var(--card);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .donut-inner strong { font-size: 16px; }
    .donut-inner span { font-size: 9px; color: var(--muted); }

    .status-bars { display: flex; flex-direction: column; gap: 6px; }
    .status-row {
      display: grid; grid-template-columns: 72px 1fr 36px;
      gap: 8px; align-items: center; font-size: 12px;
    }
    .status-track {
      height: 6px; border-radius: 4px; background: var(--bg); overflow: hidden;
    }
    .status-fill { height: 100%; border-radius: 4px; }

    .mod-row {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 0; border-bottom: 1px solid var(--border);
      text-decoration: none; color: inherit;
    }
    .mod-row:last-child { border-bottom: none; }
    .mod-row:hover .mod-name { color: var(--primary); }
    .mod-logo {
      width: 32px; height: 32px; border-radius: 8px; object-fit: cover;
      background: var(--primary); color: #fff; display: flex; align-items: center;
      justify-content: center; font-weight: 700; flex-shrink: 0; font-size: 13px;
    }
    .mod-name { font-size: 13px; font-weight: 600; }
    .mod-sub { font-size: 11px; color: var(--muted); }
    .snap-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .snap-cell {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px;
    }
    .snap-cell .k { font-size: 10px; color: var(--muted); text-transform: uppercase; }
    .snap-cell .v { font-size: 18px; font-weight: 750; margin-top: 2px; }
  </style>
</head>
<body>
  <div id="app" class="layout"></div>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    requireAuth();
    document.addEventListener("auth-ready", async function () {
      mountShell("Dashboard");
      var root = document.getElementById("page-content");
      root.innerHTML =
        '<div class="page-header">' +
          '<div><h1>Dashboard</h1><p>Overview at a glance</p></div>' +
          '<button class="btn btn-sm" type="button" id="refreshBtn">â†» Refresh</button>' +
        '</div>' +
        '<div class="dash-qa" id="quickActions"></div>' +
        '<div class="stats-grid" id="stats"><div class="empty"><span class="spinner"></span></div></div>' +
        '<div class="dash-row">' +
          '<div class="dash-panel">' +
            '<div class="dash-panel-h"><h2>Keys Â· 14 days</h2><span class="meta" id="chart14Meta"></span></div>' +
            '<div class="bar-chart" id="chart14"></div>' +
          '</div>' +
          '<div class="dash-panel">' +
            '<div class="dash-panel-h"><h2>Status mix</h2><span class="meta" id="statusMeta"></span></div>' +
            '<div class="donut-wrap" id="statusDonut"></div>' +
            '<div class="status-bars" id="statusBars"></div>' +
          '</div>' +
        '</div>' +
        '<div class="dash-row">' +
          '<div class="dash-panel">' +
            '<div class="dash-panel-h"><h2>Apps</h2><a class="btn btn-sm" href="mods.html">Open â†’</a></div>' +
            '<div id="byMod"><div class="empty"><span class="spinner"></span></div></div>' +
          '</div>' +
          '<div class="dash-panel">' +
            '<div class="dash-panel-h"><h2>Keys snapshot</h2><a class="btn btn-sm" href="keys.html">All â†’</a></div>' +
            '<div id="keysSnap"></div>' +
          '</div>' +
        '</div>';

      document.getElementById("refreshBtn").onclick = function () { loadDashboard(); };
      loadDashboard();
    });

    async function loadDashboard() {
      try {
        var data = await api("/stats");
        var s = data.data || {};
        var t = s.totals || {};
        var role = (window.__user && window.__user.role) || "";

        // Quick actions
        var qa = document.getElementById("quickActions");
        qa.innerHTML =
          '<a href="keys.html"><span class="ico" style="background:rgba(99,102,241,0.2)">ðŸ”‘</span> Keys Â· ' + esc(String(t.total || 0)) + '</a>' +
          '<a href="mods.html"><span class="ico" style="background:rgba(167,139,250,0.2)">ðŸ“±</span> Apps Â· ' + esc(String(t.apps || 0)) + '</a>' +
          '<a href="new-key.html"><span class="ico" style="background:rgba(34,197,94,0.2)">ï¼‹</span> Purchase</a>' +
          (role === "ruler" || role === "superadmin"
            ? '<a href="resellers.html"><span class="ico" style="background:rgba(56,189,248,0.2)">ðŸ‘¥</span> Sellers Â· ' + esc(String(t.sellers || 0)) + '</a>'
            : '');

        // Stat cards
        var cards = [
          { label: "Total Keys", value: t.total, sub: (t.devices || 0) + " devices bound", href: "keys.html", color: "var(--fg)" },
          { label: "Active", value: t.active, sub: "not expired", href: "keys.html", color: "var(--success)" },
          { label: "Paused / Banned", value: (t.paused || 0) + (t.banned || 0), sub: (t.paused || 0) + " paused Â· " + (t.banned || 0) + " banned", href: "keys.html", color: "var(--warning)" },
          { label: "Expired / Revoked", value: (t.expired || 0) + (t.revoked || 0), sub: (t.expired || 0) + " exp Â· " + (t.revoked || 0) + " rev", href: "keys.html", color: "var(--danger)" },
          { label: "Trial Keys", value: t.trialTotal || 0, sub: (t.trialActive || 0) + " active Â· " + (t.trialDevices || 0) + " devices", href: "keys.html", color: "#a78bfa" },
          { label: "Apps", value: t.apps || 0, sub: (t.activeApps || 0) + " enabled", href: "mods.html", color: "#38bdf8" },
        ];
        if (s.wallet) {
          cards.push({
            label: "Wallet",
            value: "à§³" + Number(s.wallet.balance || 0).toFixed(0),
            sub: "your balance",
            href: "settings.html",
            color: "var(--primary)"
          });
        }
        if (role === "ruler" || role === "superadmin") {
          cards.push({
            label: "Sellers",
            value: t.sellers || 0,
            sub: (t.sellersActive || 0) + " active",
            href: "resellers.html",
            color: "#f472b6"
          });
        }

        document.getElementById("stats").innerHTML = cards.map(function (c) {
          return '<a class="stat-card clickable" href="' + esc(c.href) + '">' +
            '<div class="label">' + esc(c.label) + '</div>' +
            '<div class="value" style="color:' + c.color + '">' + esc(String(c.value)) + '</div>' +
            (c.sub ? '<div class="sub">' + esc(c.sub) + '</div>' : '') +
          '</a>';
        }).join("");

        // 14-day bar chart
        var days = s.last14Days || s.last7Days || [];
        var max = 1;
        days.forEach(function (d) { if (d.count > max) max = d.count; });
        var total14 = days.reduce(function(a,d){ return a + (d.count||0); }, 0);
        var meta = document.getElementById("chart14Meta");
        if (meta) meta.textContent = total14 + " keys Â· peak " + max + " / day";
        document.getElementById("chart14").innerHTML = days.length
          ? days.map(function (d) {
              var h = Math.max(3, Math.round((d.count / max) * 100));
              var label = String(d.date || "").slice(5);
              return '<div class="bar-col">' +
                '<div class="bar-val">' + (d.count ? esc(String(d.count)) : "") + '</div>' +
                '<div class="bar" style="height:' + h + '%" title="' + esc(d.date + ": " + d.count) + '"></div>' +
                '<div class="label">' + esc(label) + '</div></div>';
            }).join("")
          : '<div class="empty">No data yet</div>';

        // Status breakdown
        var br = (s.statusBreakdown || []).filter(function (x) { return x.count > 0; });
        var sum = br.reduce(function (a, x) { return a + x.count; }, 0) || 1;
        var angle = 0;
        var stops = [];
        br.forEach(function (x) {
          var deg = (x.count / sum) * 360;
          stops.push(x.color + " " + angle + "deg " + (angle + deg) + "deg");
          angle += deg;
        });
        if (!stops.length) stops.push("#27272a 0deg 360deg");

        document.getElementById("statusDonut").innerHTML =
          '<div class="donut" style="background:conic-gradient(' + stops.join(",") + ')">' +
            '<div class="donut-inner"><strong>' + esc(String(t.total || 0)) + '</strong><span>keys</span></div></div>';
        var sm = document.getElementById("statusMeta");
        if (sm) sm.textContent = br.length + " statuses";
        document.getElementById("statusBars").innerHTML = br.length
          ? br.map(function (x) {
              var pct = Math.round((x.count / sum) * 100);
              return '<div class="status-row">' +
                '<span>' + esc(x.status) + '</span>' +
                '<div class="status-track"><div class="status-fill" style="width:' + pct + '%;background:' + x.color + '"></div></div>' +
                '<span style="text-align:right;font-weight:650">' + esc(String(x.count)) + '</span></div>';
            }).join("")
          : '<div class="empty">No keys</div>';

        var sm = document.getElementById("statusMeta");
        if (sm) sm.textContent = (t.devices || 0) + " devices bound Â· auto";
        document.getElementById("statusBars").innerHTML = (s.statusBreakdown || []).map(function (x) {
          var pct = sum ? Math.round((x.count / sum) * 100) : 0;
          return '<div class="status-row">' +
            '<span class="name">' + esc(x.status) + '</span>' +
            '<div class="track"><div class="fill" style="width:' + pct + '%;background:' + x.color + '"></div></div>' +
            '<span class="cnt">' + esc(String(x.count)) + '</span></div>';
        }).join("");

        // Apps list
        var mods = s.byMod || [];
        var maxMod = 1;
        mods.forEach(function (m) { if (m.keyCount > maxMod) maxMod = m.keyCount; });
        document.getElementById("byMod").innerHTML = mods.length
          ? '<div class="mod-list">' + mods.map(function (m) {
              var initial = esc((m.displayName || m.name || '?').charAt(0).toUpperCase());
              var logo = m.logoUrl
                ? ('<img class="mod-logo" src="' + esc(m.logoUrl) + '" alt="">')
                : ('<div class="mod-logo">' + initial + '</div>');
              return '<a class="mod-row" href="mods.html">' + logo +
                '<div style="flex:1;min-width:0">' +
                  '<div style="font-weight:600;font-size:13px">' + esc(m.displayName || m.name) +
                    (m.isActive === false ? ' <span class="badge badge-deleted">off</span>' : '') +
                  '</div>' +
                  '<div style="height:5px;background:var(--bg);border-radius:3px;margin-top:6px;overflow:hidden">' +
                    '<div style="height:100%;width:' + Math.round((m.keyCount / maxMod) * 100) + '%;background:var(--primary)"></div></div>' +
                '</div>' +
                '<span style="color:var(--muted);font-size:12px">ðŸ”‘ ' + esc(String(m.keyCount)) + '</span></a>';
            }).join("") + '</div>'
          : '<div class="empty">No apps yet. <a href="mods.html">Add one â†’</a></div>';

        // Keys snapshot
        document.getElementById("keysSnap").innerHTML =
          '<div class="snap-grid">' +
            snapTile("Active", t.active, "#22c55e", "keys.html") +
            snapTile("Trial", t.trialTotal, "#a78bfa", "keys.html") +
            snapTile("Devices (auto)", t.devices, "#38bdf8", "keys.html") +
            snapTile("Paused", t.paused, "#f59e0b", "keys.html") +
          '</div>' +
          '<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">' +
            '<a class="btn btn-sm btn-primary" href="new-key.html">+ Purchase</a>' +
            '<a class="btn btn-sm" href="keys.html">Browse keys</a>' +
            '<a class="btn btn-sm" href="mods.html">Manage apps</a>' +
          '</div>';
      } catch (err) {
        document.getElementById("stats").innerHTML =
          '<div class="alert alert-error">' + esc(err.message || String(err)) + '</div>';
      }
    }

    function snapTile(label, value, color, href) {
      return '<a href="' + href + '" style="text-decoration:none;color:inherit;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--bg);display:block">' +
        '<div style="font-size:11px;color:var(--muted)">' + esc(label) + '</div>' +
        '<div style="font-size:20px;font-weight:700;color:' + color + '">' + esc(String(value != null ? value : 0)) + '</div></a>';
    }
  </script>
</body>
</html>
