<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline';
  img-src 'self' https: data:;
  connect-src 'self' https: http://localhost:* http://127.0.0.1:*;
">  <title>Wallets — Fox Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="layout"></div>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    requireAuth();
    document.addEventListener("auth-ready", async () => {
      var user = window.__user;
      if (user.role === "reseller") {
        loadMyWallet();
      } else {
        loadAllWallets();
      }
    });

    async function loadAllWallets() {
      document.getElementById("app").innerHTML = renderNav("Wallets") + '<div class="page-header"><h1>Wallets</h1><p>Manage reseller wallet balances.</p></div><div id="content"><div class="empty"><span class="spinner"></span></div></div></main>';
      try {
        var res = await api("/wallets");
        var wallets = res.data;
        document.getElementById("content").innerHTML = wallets.length === 0
          ? '<div class="card"><div class="card-body empty">No wallets yet.</div></div>'
          : '<div class="card"><div class="table-wrap"><table><thead><tr><th>Reseller</th><th>Balance</th><th>Currency</th><th>Actions</th></tr></thead><tbody>' +
            wallets.map(function(w) {
              return '<tr><td>' + esc(w.username) + '</td><td class="mono" style="color:var(--success)">' + esc(formatMoney(w.balance)) + '</td><td>' + esc(w.currency) + '</td><td><button class="btn btn-sm" onclick="rechargeWallet(\'' + esc(w.id) + '\',\'' + esc(w.username) + '\')">Recharge</button> <button class="btn btn-sm" onclick="viewWallet(\'' + esc(w.id) + '\')">View</button></td></tr>';
            }).join("") + '</tbody></table></div></div>';
      } catch(e) {
        document.getElementById("content").innerHTML = '<div class="alert alert-error">' + esc(e.message) + '</div>';
      }
    }

    async function loadMyWallet() {
      document.getElementById("app").innerHTML = renderNav("Wallets") + '<main class="main"><div class="page-header"><h1>My Wallet</h1></div><div id="content"><div class="empty"><span class="spinner"></span></div></div></main>';
      try {
        var res = await api("/wallets/me");
        var w = res.data;
        document.getElementById("content").innerHTML =
          '<div class="stats-grid"><div class="stat-card"><div class="label">Balance</div><div class="value" style="color:var(--success)">' + esc(formatMoney(w.balance)) + ' ' + esc(w.currency) + '</div></div></div>' +
          '<div class="card"><div class="card-header"><h2>Transaction History</h2></div><div class="table-wrap">' +
          (w.transactions.length === 0 ? '<div class="empty">No transactions yet.</div>' :
          '<table><thead><tr><th>Type</th><th>Amount</th><th>Before</th><th>After</th><th>Description</th><th>Date</th></tr></thead><tbody>' +
          w.transactions.map(function(t) {
            var color = t.amount >= 0 ? "var(--success)" : "var(--danger)";
            return '<tr><td><span class="badge">' + esc(t.type) + '</span></td><td class="mono" style="color:' + color + '">' + esc(formatMoney(t.amount)) + '</td><td class="mono">' + esc(formatMoney(t.balanceBefore)) + '</td><td class="mono">' + esc(formatMoney(t.balanceAfter)) + '</td><td>' + esc(t.description || "—") + '</td><td style="color:var(--muted);font-size:12px">' + esc(formatDate(t.createdAt)) + '</td></tr>';
          }).join("") + '</tbody></table>') + '</div></div>';
      } catch(e) {
        document.getElementById("content").innerHTML = '<div class="alert alert-error">' + esc(e.message) + '</div>';
      }
    }

    async function rechargeWallet(walletId, username) {
      var amount = prompt("Recharge amount for " + username + ":");
      if (!amount) return;
      var desc = prompt("Description (optional):") || "Recharge";
      try {
        await api("/wallets/" + walletId + "/recharge", { method: "POST", body: { amount: parseFloat(amount), description: desc } });
        showToast("Recharged " + amount + " BDT");
        loadAllWallets();
      } catch(e) { showToast(e.message, "error"); }
    }

    async function viewWallet(walletId) {
      try {
        var res = await api("/wallets/" + walletId);
        var w = res.data;
        alert("Wallet: " + w.username + "\nBalance: " + formatMoney(w.balance) + " " + w.currency + "\n\nTransactions: " + w.transactions.length);
      } catch(e) { showToast(e.message, "error"); }
    }
  </script>
</body>
</html>
