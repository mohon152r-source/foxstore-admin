<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline';
  img-src 'self' https: data:;
  connect-src 'self' https: http://localhost:* http://127.0.0.1:*;
">
  <title>Wallets — Fox Store</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
    .stat-card .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
    .stat-card .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; background: var(--bg); border: 1px solid var(--border); }
  </style>
</head>
<body>
  <div id="app" class="layout"></div>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    requireAuth();
    document.addEventListener("auth-ready", async function () {
      var user = window.__user;
      if (!user) return;
      
      if (user.role === "reseller") {
        mountShell("Wallets");
        loadMyWallet();
      } else {
        mountShell("Wallets");
        loadAllWallets();
      }
    });

    async function loadAllWallets() {
      var content = document.getElementById("page-content");
      if (!content) return;
      
      content.innerHTML =
        '<div class="page-header"><h1>Wallets</h1><p>Manage reseller wallet balances.</p></div>' +
        '<div id="walletContent"><div class="empty"><span class="spinner"></span></div></div>';
      
      var box = document.getElementById("walletContent");
      try {
        var res = await api("/wallets");
        var wallets = res.data || [];
        box.innerHTML = wallets.length === 0
          ? '<div class="card"><div class="card-body"><div class="empty">No wallets yet.</div></div></div>'
          : '<div class="card"><div class="table-wrap"><table><thead><tr><th>Reseller</th><th>Balance</th><th>Currency</th><th>Actions</th></tr></thead><tbody>' +
            wallets.map(function(w) {
              return '<tr>' +
                '<td><strong>' + esc(w.username || "—") + '</strong></td>' +
                '<td class="mono" style="color:var(--success)">' + esc(formatMoney(w.balance || 0)) + '</td>' +
                '<td>' + esc(w.currency || "BDT") + '</td>' +
                '<td>' +
                  '<button class="btn btn-sm" type="button" onclick="rechargeWallet(\'' + esc(w.id) + '\',\'' + esc(w.username || "") + '\')">Recharge</button> ' +
                  '<button class="btn btn-sm" type="button" onclick="viewWallet(\'' + esc(w.id) + '\')">View</button>' +
                '</td>' +
              '</tr>';
            }).join("") + '</tbody></table></div></div>';
      } catch(e) {
        box.innerHTML = '<div class="alert alert-error">' + esc(e.message || String(e)) + '</div>';
      }
    }

    async function loadMyWallet() {
      var content = document.getElementById("page-content");
      if (!content) return;
      
      content.innerHTML =
        '<div class="page-header"><h1>My Wallet</h1></div>' +
        '<div id="walletContent"><div class="empty"><span class="spinner"></span></div></div>';
      
      var box = document.getElementById("walletContent");
      try {
        var res = await api("/wallets/me");
        var w = res.data || {};
        var transactions = w.transactions || [];
        
        var txHtml = transactions.length === 0
          ? '<div class="empty">No transactions yet.</div>'
          : '<div class="table-wrap"><table><thead><tr><th>Type</th><th>Amount</th><th>Before</th><th>After</th><th>Description</th><th>Date</th></tr></thead><tbody>' +
            transactions.map(function(t) {
              var color = Number(t.amount) >= 0 ? "var(--success)" : "var(--danger)";
              return '<tr>' +
                '<td><span class="badge">' + esc(t.type || "—") + '</span></td>' +
                '<td class="mono" style="color:' + color + '">' + esc(formatMoney(t.amount || 0)) + '</td>' +
                '<td class="mono">' + esc(formatMoney(t.balanceBefore || 0)) + '</td>' +
                '<td class="mono">' + esc(formatMoney(t.balanceAfter || 0)) + '</td>' +
                '<td>' + esc(t.description || "—") + '</td>' +
                '<td style="color:var(--muted);font-size:12px">' + esc(formatDate(t.createdAt)) + '</td>' +
              '</tr>';
            }).join("") + '</tbody></table></div>';
        
        box.innerHTML =
          '<div class="stats-grid">' +
            '<div class="stat-card"><div class="label">Balance</div><div class="value" style="color:var(--success)">' + esc(formatMoney(w.balance || 0)) + '</div><div style="font-size:11px;color:var(--muted);margin-top:2px">' + esc(w.currency || "BDT") + '</div></div>' +
            '<div class="stat-card"><div class="label">Transactions</div><div class="value">' + esc(String(transactions.length)) + '</div></div>' +
          '</div>' +
          '<div class="card"><div class="card-header"><h2>Transaction History</h2></div><div class="card-body">' + txHtml + '</div></div>';
      } catch(e) {
        box.innerHTML = '<div class="alert alert-error">' + esc(e.message || String(e)) + '</div>';
      }
    }

    async function rechargeWallet(walletId, username) {
      var amount = prompt("Recharge amount for " + username + ":");
      if (!amount) return;
      var amt = parseFloat(amount);
      if (isNaN(amt) || amt <= 0) { showToast("Invalid amount", "error"); return; }
      var desc = prompt("Description (optional):") || "Recharge";
      try {
        await api("/wallets/" + encodeURIComponent(walletId) + "/recharge", { method: "POST", body: { amount: amt, description: desc } });
        showToast("Recharged " + amt + " BDT");
        loadAllWallets();
      } catch(e) { showToast(e.message || String(e), "error"); }
    }

    async function viewWallet(walletId) {
      try {
        var res = await api("/wallets/" + encodeURIComponent(walletId));
        var w = res.data || {};
        var transactions = w.transactions || [];
        alert("Wallet: " + (w.username || "—") + "\nBalance: " + formatMoney(w.balance || 0) + " " + (w.currency || "BDT") + "\n\nTransactions: " + transactions.length);
      } catch(e) { showToast(e.message || String(e), "error"); }
    }

    // Make functions globally accessible
    window.rechargeWallet = rechargeWallet;
    window.viewWallet = viewWallet;
  </script>
</body>
</html>
