<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline';
  img-src 'self' https: data:;
  connect-src 'self' https: http://localhost:* http://127.0.0.1:*;
">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="no-referrer">
  <title>Fox Store — Login</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      background: var(--bg);
    }
    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
    }
    .logo {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      margin: 0 auto 16px;
    }
    .login-card h1 {
      text-align: center;
      font-size: 22px;
      margin: 0 0 4px;
    }
    .login-card > p {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 24px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      font-size: 14px;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
    }
    .btn-block {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
    }
    .alert {
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 13px;
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }
    .forgot-link {
      display: block;
      text-align: center;
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
      background: none;
      border: none;
      width: 100%;
    }
    .forgot-link:hover {
      color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="logo" id="brandLogoWrap">F</div>
      <h1 id="brandTitle">Fox Store</h1>
      <p>License & key control panel</p>
      
      <div id="error" class="alert alert-error" style="display:none"></div>
      
      <!-- Login Form -->
      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autocomplete="username" placeholder="Your username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" minlength="4" placeholder="Min 4 characters">
        </div>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:14px;cursor:pointer">
          <input type="checkbox" id="rememberMe" style="width:auto;margin:0" checked>
          Remember me
        </label>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Sign In</button>
      </form>
      
      <button type="button" class="forgot-link" id="forgotOpen">Forgot password?</button>
      
      <!-- Forgot Password Panel -->
      <div id="forgotPanel" style="display:none;margin-top:14px">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="fpUser" autocomplete="username" placeholder="Enter username">
        </div>
        <div class="form-group" id="fpOtpGroup" style="display:none">
          <label>OTP from Telegram</label>
          <input type="text" id="fpOtp" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit OTP">
        </div>
        <div class="form-group" id="fpPassGroup" style="display:none">
          <label>New Password</label>
          <input type="password" id="fpPass" minlength="4" placeholder="Enter new password">
        </div>
        <button type="button" class="btn btn-primary btn-block" id="fpBtn">Send OTP</button>
        <button type="button" class="btn btn-block" id="fpBack" style="margin-top:8px">Back to login</button>
      </div>
      
      <p id="apiHint" style="font-size:11px;color:var(--muted);text-align:center;margin-top:14px"></p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    var CRED_KEY = "dfox_login_creds";
    var forgotStep = 1;

    function apiRoot() {
      try {
        if (typeof getApiBase === "function") return String(getApiBase()).replace(/\/$/, "");
        if (window.DFOX_API_BASE) return String(window.DFOX_API_BASE).replace(/\/$/, "");
      } catch (e) {}
      return "https://foxstore-api.mohon153r.workers.dev";
    }

    function showErr(msg) {
      var errDiv = document.getElementById("error");
      if (!errDiv) { alert(msg); return; }
      errDiv.textContent = msg;
      errDiv.style.display = "block";
    }

    function hideErr() {
      var errDiv = document.getElementById("error");
      if (errDiv) errDiv.style.display = "none";
    }

    function saveCreds(u, p) {
      try {
        if (document.getElementById("rememberMe").checked) {
          localStorage.setItem(CRED_KEY, JSON.stringify({ u: u, p: p }));
        } else {
          localStorage.removeItem(CRED_KEY);
        }
      } catch (e) {}
    }

    function loadSavedCreds() {
      try {
        var raw = localStorage.getItem(CRED_KEY);
        if (!raw) return;
        var c = JSON.parse(raw);
        if (c && c.u) document.getElementById("username").value = c.u;
        if (c && c.p) document.getElementById("password").value = c.p;
      } catch (e) {}
    }

    // Load branding
    (async function loadBrand() {
      try {
        var res = await fetch(apiRoot() + "/api/admin/settings/branding", { cache: "no-store" });
        var st = await res.json();
        if (st.ok && st.data) {
          var name = st.data.brandName || "Fox Store";
          var logo = st.data.logoUrl || "";
          
          var title = document.getElementById("brandTitle");
          if (title) title.textContent = name;
          
          if (logo) {
            var wrap = document.getElementById("brandLogoWrap");
            wrap.innerHTML = '<img src="' + esc(logo) + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit" onerror="this.remove()">';
          }
        }
      } catch (e) { /* ignore branding errors */ }
    })();

    // Check if already logged in
    if (typeof getToken === "function" && getToken()) {
      checkAuth().then(function(user) {
        if (user) window.location.replace("dashboard.html");
        else clearToken();
      });
    }

    // Load saved credentials
    loadSavedCreds();

    // API hint
    var hint = document.getElementById("apiHint");
    if (hint) hint.textContent = "API: " + apiRoot();

    // Forgot password toggle
    document.getElementById("forgotOpen").onclick = function() {
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("forgotOpen").style.display = "none";
      document.getElementById("forgotPanel").style.display = "";
      forgotStep = 1;
      document.getElementById("fpBtn").textContent = "Send OTP";
      document.getElementById("fpOtpGroup").style.display = "none";
      document.getElementById("fpPassGroup").style.display = "none";
    };

    document.getElementById("fpBack").onclick = function() {
      document.getElementById("forgotPanel").style.display = "none";
      document.getElementById("loginForm").style.display = "";
      document.getElementById("forgotOpen").style.display = "";
    };

    document.getElementById("fpBtn").onclick = async function() {
      var username = document.getElementById("fpUser").value.trim();
      if (!username) { showErr("Username required"); return; }
      
      var btn = document.getElementById("fpBtn");
      btn.disabled = true;
      
      try {
        if (forgotStep === 1) {
          // Send OTP
          var res = await fetch(apiRoot() + "/api/admin/auth/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: username })
          });
          var data = await res.json();
          
          if (!res.ok || data.ok === false) {
            throw new Error(data.error || "Failed to send OTP");
          }
          
          showToast("OTP sent to Telegram");
          forgotStep = 2;
          document.getElementById("fpOtpGroup").style.display = "";
          document.getElementById("fpPassGroup").style.display = "";
          btn.textContent = "Reset Password";
        } else {
          // Reset password
          var otp = document.getElementById("fpOtp").value.trim();
          var newPassword = document.getElementById("fpPass").value;
          
          if (!otp || otp.length !== 6) { showErr("Enter 6-digit OTP"); return; }
          if (newPassword.length < 4) { showErr("Password must be at least 4 characters"); return; }
          
          var res2 = await fetch(apiRoot() + "/api/admin/auth/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: username, otp: otp, newPassword: newPassword })
          });
          var data2 = await res2.json();
          
          if (!res2.ok || data2.ok === false) {
            throw new Error(data2.error || "Failed to reset password");
          }
          
          showToast("Password updated! Login now.");
          document.getElementById("fpBack").onclick();
        }
      } catch (e) {
        showErr(e.message || "Failed");
      }
      
      btn.disabled = false;
    };

    // Login form submit
    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      
      var btn = document.getElementById("submitBtn");
      var username = document.getElementById("username").value.trim();
      var password = document.getElementById("password").value;
      
      if (!username) { showErr("Username required"); return; }
      if (password.length < 4) { showErr("Password must be at least 4 characters"); return; }
      
      btn.disabled = true;
      btn.textContent = "Signing in...";
      hideErr();
      
      try {
        var ctrl = new AbortController();
        var timer = setTimeout(function() { ctrl.abort(); }, 20000);
        
        var res = await fetch(apiRoot() + "/api/admin/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: username, password: password }),
          cache: "no-store",
          signal: ctrl.signal
        });
        
        clearTimeout(timer);
        var data = await res.json();
        
        if (data.ok && data.token) {
          setToken(data.token);
          if (data.user) setUser(data.user);
          saveCreds(username, password);
          window.location.replace("dashboard.html");
          return;
        }
        
        showErr(data.error || "Login failed");
      } catch (err) {
        if (err && err.name === "AbortError") {
          showErr("Timeout — server not responding");
        } else {
          showErr("Network error: " + (err.message || err));
        }
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
